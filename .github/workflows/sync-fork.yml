name: Custom Sync Upstream (Preserve .github)

on:
  push:
    paths:
      - '.github/workflows/sync_fork.yml'
  # schedule:
  #   - cron: '0 0 * * *'
  workflow_dispatch:  # 手动触发

permissions:
  contents: write        # 允许推送分支、修改仓库内容
  pull-requests: write   # 允许创建和管理 PR

env:
  GITHUB_TOKEN: ${{ secrets.PAT }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
    steps:
      - name: 检出当前代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: master

      - name: "初始化 Git 配置"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游远程
        run: git remote add upstream https://github.com/alibaba/MNN.git

      - name: 获取上游更改
        run: git fetch upstream master

      - name: "合并和处理 .github 目录"
        id: check_changes
        run: |
          # 备份本地 .github 目录
          mv .github .github_backup

          # 合并上游变更
          git merge -X theirs upstream/master --no-commit --allow-unrelated-histories
          git status

          # 恢复自定义 .github 目录
          rm -rf .github
          mv .github_backup .github

          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "工作区和暂存区无任何未提交改动"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "检测到未提交的改动"
            git diff
            echo "======="
          fi

      - name: 推送到远程和设置创建时间
        if: steps.check_changes.outputs.has_changes == 'true'
        id: sync_time
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          # 创建带时间戳的同步分支，避免直接推主分支，更符合PR规范
          PR_NAME="sync-upstream/$(date +%Y%m%d-%H%M)"
          git checkout -b $PR_NAME
          git commit -m "feat: 同步上游 alibaba:master, 保留自定义 .github 文件夹"
          git push origin -f $PR_NAME

          echo "pr_title=$(PR_NAME)" >> $GITHUB_OUTPUT

      - name: 创建同步PR
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          commit-message: "feat: 同步上游 alibaba:master, 保留自定义 .github 文件夹"
          branch: ${{ steps.sync_time.outputs.pr_title }} # 分支名也可以复用时间戳避免重复
          title: 自动同步上游-${{ steps.sync_time.outputs.pr_title }} # 直接引用生成的标题变量
          body: 来自 alibaba:master 上游的自动同步，.github 目录已被清理以保留本地自定义文件。
          delete-branch: true # PR合并后自动删除临时分支
