name: Custom Sync Upstream (Preserve .github)

on:
  push:
    paths:
      - '.github/workflows/sync_fork.yml'
  # schedule:
  #   - cron: '0 0 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
    steps:
      - name: 检出当前代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: master

      - name: "初始化 Git 配置"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游远程
        run: git remote add upstream https://github.com/alibaba/MNN.git

      - name: 获取上游更改
        run: git fetch upstream master

      - name: "合并和处理 .github 目录"
        run: |
          # 备份本地 .github 目录
          mv .github .github_backup

          # 合并上游变更
          git merge -X theirs upstream/master --no-commit --allow-unrelated-histories
          git status

          # 恢复自定义 .github 目录
          rm -rf .github
          mv .github_backup .github

          git diff --quiet && git diff --staged --quiet

          # 完成合并提交
          if git diff --quiet && git diff --staged --quiet; then
            echo "没有新的同步更改"
            exit 0
          fi

          git add .
          git commit -m "feat: 同步上游 alibaba:master, 保留自定义 .github 文件夹"

      - name: 推送到远程和自动创建PR
        run: |
          # 创建带时间戳的同步分支，避免直接推主分支，更符合PR规范
          PR_NAME="sync-upstream/$(date +%Y%m%d-%H%M)"
          SYNC_BRANCH="sync-upstream"
          git checkout -b $SYNC_BRANCH
          git push origin -f $SYNC_BRANCH

          # 调用GitHub CLI自动创建PR
          gh pr create \
            --base master \
            --head "$SYNC_BRANCH" \
            --title "自动同步上游 (${PR_NAME})" \
            --body "来自 alibaba:master 上游的自动同步，.github 目录已被清理以保留本地自定义文件。"
