name: Custom Sync Upstream (Preserve .github)

on:
  push:
    paths:
      - '.github/workflows/sync-fork.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.PAT }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
    steps:
      - name: 检出当前代码
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: 初始化 Git 配置
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 添加上游远程
        run: git remote add upstream https://github.com/alibaba/MNN.git

      - name: 获取上游更改
        run: git fetch upstream master

      - name: 检查是否有需要同步的上游变更
        id: upstream_check
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "upstream/master 已被当前 master 包含，无需同步"
            echo "upstream_ahead=false" >> "$GITHUB_OUTPUT"
          else
            echo "发现上游新提交："
            git log --oneline HEAD..upstream/master | head
            echo "upstream_ahead=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 合并上游并保留 .github
        id: merge_changes
        if: steps.upstream_check.outputs.upstream_ahead == 'true'
        run: |
          set -euo pipefail

          cp -a .github .github_backup

          if ! git merge --no-commit --no-ff upstream/master; then
            echo '出现合并冲突，按策略解决：.github 保留本地，其他取上游'
          fi

          git ls-files --unmerged | awk '{print $4}' | sort -u | while IFS= read -r f; do
            if [[ "$f" == .github/* ]]; then
              git checkout --ours -- "$f" 2>/dev/null || git checkout --theirs -- "$f" 2>/dev/null || true
            else
              git checkout --theirs -- "$f" 2>/dev/null || git checkout --ours -- "$f" 2>/dev/null || true
            fi
            git add -- "$f"
          done

          rm -rf .github
          mv .github_backup .github
          rm -rf .github_backup

          git add -A

          if git diff --cached --quiet; then
            echo "合并后没有实际差异"
            git merge --abort || git reset --merge
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "feat: 同步上游 alibaba:master，保留自定义 .github"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送同步分支
        id: push_branch
        if: steps.upstream_check.outputs.upstream_ahead == 'true' && steps.merge_changes.outputs.has_changes == 'true'
        run: |
          sudo timedatectl set-timezone Asia/Shanghai
          SYNC_BRANCH="sync-upstream-sync-$(date -u +%Y%m%d_%H%M%S)"
          # 避免与仓库中 sync-upstream/ 前缀目录发生 refs 冲突
          git checkout -B "$SYNC_BRANCH"
          git push origin -f HEAD:refs/heads/"$SYNC_BRANCH"
          echo "sync_branch=${SYNC_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: 创建同步PR
        if: steps.push_branch.conclusion == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          commit-message: "feat: 同步上游 alibaba:master，保留自定义 .github"
          base: master
          branch: ${{ steps.push_branch.outputs.sync_branch }}
          title: 自动同步上游 alibaba:master
          body: 来自 alibaba:master 的自动同步，保留本地 .github 自定义配置。
          delete-branch: false
          maintainer-can-modify: true
