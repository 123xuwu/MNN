    name: Sync Fork with Upstream
    on:
      # schedule:
        # 配置定时执行，这里设置为每天凌晨2点自动同步，可自行修改时间
        # - cron: '0 18 * * *'

      # 支持手动触发同步
      workflow_dispatch:

    jobs:
      sync:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout 代码
            uses: actions/checkout@v3
            with:
              token: ${{ secrets.GITHUB_TOKEN }}
              fetch-depth: 0

          - name: 添加上游仓库
            run: git remote add upstream https://github.com/alibaba/MNN

          - name: 获取上游最新更新
            run: git fetch upstream

          - name: 合并上游变更到本地主分支
            run: git merge upstream/master --no-edit

            # 如果原项目主分支是master，将上面的main替换为master即可

          - name: 推送同步后的代码到你的fork仓库
            uses: ad-m/github-push-action@master
            with:
              github_token: ${{ secrets.GITHUB_TOKEN }}
              branch: master
