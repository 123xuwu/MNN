name: Custom Sync Upstream
on:
  # schedule:
  #   - cron: '0 2 * * *' # 每天凌晨2点执行
  # 手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: 配置Git身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

      - name: 添加上游远程仓库
        run: git remote add upstream https://github.com/alibaba/MNN

      - name: 拉取上游最新代码
        run: git fetch upstream

      - name: 创建同步分支
        run: |
          git checkout -b sync-upstream
          git merge upstream/master --no-edit || true # 自动合并，冲突保留待手动处理
          git push origin sync-upstream -f

      - name: 自动创建同步PR
        uses: repo-sync/pull-request@v2
        with:
          github_token: ${{ secrets.PAT }}
          source_branch: "sync-upstream"
          destination_branch: "master"
          pr_title: "自动同步上游仓库最新更新"
          pr_body: "本次自动拉取了上游master分支的全部提交，请检查变更后合并。"

      - name: 输出PR错误信息
        run: cat /tmp/pull-request.stderr.log
