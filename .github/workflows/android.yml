name: android
on:
  push:
    branches:
     - master
     - 'feature/**'
    paths:
      - 'source/**'
      - 'express/**'
      - 'test/**'
      - 'project/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [master]
    paths:
      - 'source/**'
      - 'express/**'
      - 'test/**'
      - 'project/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  android_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: "编译 apk"
        run: |
            cd project/android
            mkdir build_64
            cd build_64
            ../build_64.sh -DMNN_LOW_MEMORY=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_BUILD_LLM=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_ARM82=true -DMNN_USE_LOGCAT=true -DMNN_OPENCL=true -DLLM_SUPPORT_VISION=true -DMNN_BUILD_OPENCV=true -DMNN_IMGCODECS=true -DLLM_SUPPORT_AUDIO=true -DMNN_BUILD_AUDIO=true -DMNN_BUILD_DIFFUSION=ON -DMNN_SEP_BUILD=OFF -DCMAKE_INSTALL_PREFIX=.
            make install
            sleep 1
            cd ../../../apps/Android/MnnLlmChat
            ./gradlew assembleStandardDebug

      - name: "扫描 apk"
        run: |
          find . -name "*.apk" -type f

      - name: "上传 apk"
        uses: actions/upload-artifact@v4
        with:
          name: app-standard-debug.apk
          path: /home/runner/work/MNN/MNN/apps/Android/MnnLlmChat/app/build/outputs/apk/standard/debug/app-standard-debug.apk
          retention-days: 1 # 单独指定该文件仅保留1天

      - name: "获取工作流 ID"
        run: |
          # 查询当前工作流的所有工件
          echo -e "工作流 ID \n${{ github.run_id }}"
